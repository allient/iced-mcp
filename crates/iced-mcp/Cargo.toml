[package]
name = "iced-mcp"
edition.workspace = true
version.workspace = true
description = "In-app bridge that lets AI agents inspect and drive any iced application over MCP"
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
# The bridge needs no renderer of its own: iced with `advanced` and an
# executor only.
iced = { workspace = true }
iced_winit = { workspace = true }
iced-mcp-protocol = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The example is a real app, so it needs iced's default renderers.
iced = { version = "0.14", features = ["advanced"] }

[features]
# iced and winit need at least one Linux backend to compile there. On by default, as
# in iced; an app that wants only one can turn the defaults off.
default = ["x11", "wayland"]
x11 = ["iced/x11"]
wayland = ["iced/wayland"]
