[workspace]
members = [
    "crates/iced-mcp",
    "crates/iced-mcp-server",
    "crates/iced-mcp-protocol",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
# `slice::as_chunks` (crates/iced-mcp-server/src/diff.rs) is stable since 1.88.
rust-version = "1.88"
repository = "https://github.com/allient/iced-mcp"
homepage = "https://github.com/allient/iced-mcp"
readme = "README.md"
keywords = ["iced", "mcp", "gui", "testing", "ai"]
categories = ["gui", "development-tools::testing"]

[workspace.dependencies]
iced-mcp-protocol = { path = "crates/iced-mcp-protocol", version = "0.1.0" }
iced-mcp = { path = "crates/iced-mcp", version = "0.1.0" }

# iced is pre-1.0 and every minor breaks API: pinned to one minor.
# The bridge runs a custom `Program` through the shell directly, renderer-free.
# `thread-pool`: iced refuses to compile without an executor, and the bridge
# must build on its own (cargo publish, docs.rs). An app that enables `tokio`
# or `smol` still gets that one: iced picks them before the thread pool.
iced = { version = "0.14", default-features = false, features = ["advanced", "thread-pool"] }
iced_winit = { version = "0.14", default-features = false }

accesskit = { version = "0.25.2", features = ["serde"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
png = "0.18"
rmcp = { version = "3.8", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
